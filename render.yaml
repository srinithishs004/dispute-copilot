# Phase 1: one web service (webhooks, store, API and the job worker running inline)
# plus a small paid Postgres so data survives the free web service sleeping.
# Postgres is paid from Render credits (Basic-256mb, 1 GB).
services:
  - type: web
    name: dispute-copilot
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start -w server
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: DATABASE_URL
        fromDatabase:
          name: dispute-copilot-db
          property: connectionString
      # With DATABASE_URL set the worker defaults to off; there is no separate worker yet.
      - key: RUN_WORKER_INLINE
        value: "true"
      - key: PUBLIC_BASE_URL
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: DEBUG_TOKEN
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_PASSWORD_HASH
        sync: false
      - key: JUDGE_EMAIL
        sync: false
      - key: JUDGE_PASSWORD_HASH
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false

databases:
  - name: dispute-copilot-db
    plan: basic-256mb
    diskSizeGB: 1
    databaseName: dispute_copilot
    user: dispute_copilot
